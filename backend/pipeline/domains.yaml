# Keyword/phrase rules for tagging debate HEADINGS (and bill titles) with subject domains.
# Matching is case-insensitive on whole words. A trailing * means "any word ending"
# (e.g. "sanction*" matches sanction, sanctions, sanctioned). A heading may match several domains.
# Edit freely; re-run `python -m pipeline.tag_domains` (cheap) to regenerate the report.

# Procedural headings carry no topic. They are never tagged from their own words, and are
# ignored when working out what a bill is called.
generic_headings:
  - Business of Supply
  - Government Orders
  - Privilege
  - Committees of the House
  - Adjournment Proceedings
  - Routine Proceedings
  - Points of Order
  - Point of Order
  - Business of the House
  - Resumption of Debate on Address in Reply
  - Address in Reply
  - Questions on the Order Paper
  - Questions Passed as Orders for Returns
  - Petitions
  - Royal Assent
  - Oral Questions
  - Statements by Members
  - Private Members' Business
  - Motions
  - Interparliamentary Delegations
  - Presenting Reports from Interparliamentary Delegations
  - Introduction of Government Bills
  - Introduction of Private Members' Bills
  - Government Business
  - Suspension of Sitting
  - Message from the Senate
  - Message from the Governor General
  - Opening of Parliament
  - Election of Speaker
  - Statement by the Speaker
  - Tributes
  - Business of Supply Opposition Motion

# Debate-block scoring for chunks under procedural headings. A domain is assigned to the block
# when the pooled text has at least min_hits phrase matches, at least min_distinct different
# phrases, and at least min_hits_per_1k_words matches per 1000 words.
block_tagging:
  min_hits: 20
  min_distinct: 8
  min_hits_per_1k_words: 8
  # Procedural headings that bundle unrelated items (petitions on many topics, several Late Show
  # questions, ...). Their chunks are not block-tagged, so they stay `other`.
  exclude_headings:
    - Routine Proceedings
    - Petitions
    - Points of Order
    - Point of Order
    - Adjournment Proceedings
    - Business of the House
    - Questions on the Order Paper
    - Questions Passed as Orders for Returns
    - Interparliamentary Delegations
    - Presenting Reports from Interparliamentary Delegations
    - Introduction of Government Bills
    - Introduction of Private Members' Bills
    - Message from the Senate
    - Message from the Governor General
    - Royal Assent
    - Statement by the Speaker
    - Tributes
    - Statements by Members

